name: Deploy dev

# Deploys the Worker template to the dev environment and checks /health.
# Needs two secrets on the "dev" environment: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "templates/worker/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-dev.yml"

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  worker-template:
    name: Deploy the Worker template to dev
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check that the credentials are set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as secrets of the dev environment."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy
        working-directory: templates/worker
        run: pnpm exec wrangler deploy --env dev | tee "$RUNNER_TEMP/deploy.log"
      - name: Check /health
        run: |
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1)
          if [ -z "$url" ]; then
            echo "::error::Could not find the workers.dev URL in the deploy output."
            exit 1
          fi
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors \
            "$url/health" | tee "$RUNNER_TEMP/health.json"
          grep -q '"status":"ok"' "$RUNNER_TEMP/health.json"
